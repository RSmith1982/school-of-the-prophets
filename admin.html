<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<title>Administration — The School of The Prophets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{--navy:#14213D;--navy-deep:#0E1830;--burgundy:#6B1F2E;--gold:#C9A24C;--gold-soft:#E4CE8E;--parchment:#F5EFE1;--parchment-dark:#E8DFC8;--ink:#221A14;--ink-soft:#5A4E42;--green:#2F5D3A}
  *{box-sizing:border-box}
  body{margin:0;font-family:"EB Garamond",Georgia,serif;font-size:1.08rem;line-height:1.55;color:var(--ink);background:var(--parchment-dark)}
  a{color:var(--burgundy)}
  h1,h2,h3,h4{font-weight:500;line-height:1.25;margin:0}
  .wrap{width:min(100% - 2rem,72rem);margin-inline:auto}
  header{background:var(--navy);color:var(--parchment);border-bottom:3px solid var(--gold)}
  .top{display:flex;align-items:center;gap:.8rem;padding:1rem 0}
  .top img{width:44px;height:44px;flex:none}
  .top .name{font-size:1.25rem;font-weight:500}
  .top .motto{font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-soft)}
  .top a{color:var(--gold-soft);margin-left:auto;text-decoration:none}
  .hero{color:var(--parchment);padding:1.8rem 0;background:var(--navy)}
  .hero h1{font-size:2rem;color:#fff}
  .hero p{color:var(--gold-soft);margin:.3rem 0 0}
  .panel{background:var(--parchment);border:1px solid var(--gold);margin:1.5rem 0;padding:1.4rem clamp(1rem,3vw,2rem);box-shadow:0 10px 30px rgba(0,0,0,.08)}
  .panel h2{font-size:1.5rem;color:var(--navy);margin-bottom:.6rem}
  .student{border:1px solid var(--gold);background:#FBF7EC;margin:1rem 0;padding:1rem 1.2rem}
  .student h3{font-size:1.35rem;color:var(--burgundy);display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:baseline}
  .student h3 small{font-size:.85rem;color:var(--ink-soft);font-weight:400}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:1rem;margin-top:.6rem}
  .grid h4{font-size:1.05rem;color:var(--navy);border-bottom:1px solid var(--gold);margin-bottom:.4rem;padding-bottom:.2rem}
  table{width:100%;border-collapse:collapse;font-size:.98rem}
  td{padding:.3rem .3rem;border-top:1px solid var(--parchment-dark);vertical-align:top}
  .btn{font:inherit;font-size:.88rem;padding:.25rem .7rem;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:2px;cursor:pointer}
  .btn.ok{background:var(--green);border-color:var(--green)}
  .btn.ghost{background:transparent;color:var(--navy)}
  .st{display:inline-block;padding:.05rem .5rem;border-radius:2px;font-size:.88rem;white-space:nowrap}
  .st.none{background:#E3D9BF;color:var(--ink-soft)} .st.reading{background:#F1E6C8;color:var(--navy)} .st.passed{background:#DCE8DC;color:var(--green)} .st.approved{background:var(--green);color:#fff} .st.requested{background:#F3DFD0;color:var(--burgundy)}
  .note{font-size:.92rem;color:var(--ink-soft)}
  .msg{color:var(--burgundy);font-style:italic}
  input[type=email],input[type=password]{font:inherit;padding:.5rem .7rem;border:1px solid var(--gold);background:#FBF7EC;border-radius:2px;width:100%;max-width:26rem;display:block;margin:.3rem 0 .8rem}
  .filter{margin:.4rem 0 .8rem}
  .filter input{font:inherit;padding:.4rem .6rem;border:1px solid var(--gold);background:#FBF7EC;border-radius:2px;width:100%;max-width:24rem}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap top">
<img src="images/logo.svg" alt="" width="44" height="44">
<div><div class="name">The School of The Prophets</div><div class="motto">Veritas · Fides</div></div>
<a href="index.html">Home</a>
</div></header>
<section class="hero"><div class="wrap"><h1>Administration</h1><p>Bishop Robert P. Smith, Sr. — approvals and student records</p></div></section>
<main class="wrap">
<section class="panel" id="gate">
  <h2>Sign in</h2>
  <form id="f"><label>Email</label><input type="email" id="e" required><label>Password</label><input type="password" id="p" required><button class="btn" type="submit">Sign in</button><p class="msg" id="m"></p></form>
</section>
<section class="panel" id="board" hidden>
  <h2>Students <span class="note" id="count"></span></h2>
  <p class="note">Every approval you give appears at once on the student's own progress page. "Undo" removes it.</p>
  <div class="filter"><input type="search" id="q" placeholder="Search by name or email"></div>
  <div id="list"></div>
  <p><button class="btn ghost" type="button" id="out">Sign out</button></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="school.js"></script>
<script>
const S=window.School, sb=S.sb, $=s=>document.querySelector(s), esc=S.escapeHtml;
$('#f').onsubmit=async e=>{e.preventDefault(); $('#m').textContent='Signing in…'; const {error}=await sb.auth.signInWithPassword({email:$('#e').value.trim(),password:$('#p').value}); $('#m').textContent=error?error.message:''; start();};
$('#out').onclick=async()=>{await sb.auth.signOut(); start();};
let DATA=null;
async function start(){
  const u=await S.user();
  if(!u){ $('#gate').hidden=false; $('#board').hidden=true; return; }
  if(!S.isAdminUser(u)){ $('#gate').hidden=false; $('#board').hidden=true; $('#m').textContent='This page is for the Bishop only. You are signed in as '+u.email+'.'; return; }
  $('#gate').hidden=true; $('#board').hidden=false;
  const [st,ap,cp,rp,pr,at]=await Promise.all([
    sb.rpc('admin_students'), sb.from('approvals').select('*'), sb.from('course_progress').select('*'),
    sb.from('reading_progress').select('*'), sb.from('practical_requests').select('*').order('requested_at'), sb.from('exam_attempts').select('*').order('taken_at')
  ]);
  DATA={students:st.data||[],ap:ap.data||[],cp:cp.data||[],rp:rp.data||[],pr:pr.data||[],at:at.data||[]};
  if(st.error) $('#list').innerHTML='<p class="msg">'+esc(st.error.message)+'</p>';
  draw();
}
function stt(c,t){return `<span class="st ${c}">${t}</span>`;}
function approveBtn(uid,item,label,extra){
  const a=DATA.ap.find(x=>x.user_id===uid&&x.item===item&&x.approved);
  return a? `${stt('approved',label||'Approved')} <span class="note">${S.fmtDate(a.approved_at)}</span> <button class="btn ghost" data-un="${uid}|${item}">Undo</button>`
          : `<button class="btn ok" data-ok="${uid}|${item}">Approve${extra?' '+extra:''}</button>`;
}
function draw(){
  const q=($('#q').value||'').toLowerCase();
  const list=DATA.students.filter(s=>!q||(s.name+' '+s.email).toLowerCase().includes(q));
  $('#count').textContent=`(${DATA.students.length})`;
  $('#list').innerHTML=list.map(s=>{
    const uid=s.id, req=S.requirements(s.diploma), plan=S.PLANS[s.plan]||S.PLANS.english;
    const rp=DATA.rp.find(x=>x.user_id===uid&&x.plan===s.plan); const readDone=(rp&&rp.done||[]).filter(n=>n>=1&&n<=plan.total).length;
    const courses=req.courses.map(slug=>{ const c=S.COURSES[slug]; const cp=DATA.cp.find(x=>x.user_id===uid&&x.course===slug);
      const att=DATA.at.filter(x=>x.user_id===uid&&x.course===slug);
      let status=!c.built?stt('none','Coming soon'):cp&&cp.status==='passed'?stt('passed',`Passed ${cp.best_score}%`):cp?stt('reading',`In progress · best ${cp.best_score}% · ${cp.fails} failed`):stt('none','Not started');
      const hist=att.length?`<div class="note">${att.map(a=>`${a.score}%${a.passed?' ✓':''} ${new Date(a.taken_at).toLocaleDateString()}`).join(' · ')}</div>`:'';
      return `<tr><td>${esc(c.title)}</td><td>${status}${hist}</td><td>${(cp&&cp.status==='passed')||DATA.ap.find(x=>x.user_id===uid&&x.item==='course:'+slug)?approveBtn(uid,'course:'+slug):''}</td></tr>`; }).join('');
    const practical=req.practical.map(pr=>{ const level=pr.level;
      const rows=[`<tr><td colspan="3"><strong>${esc(S.COURSES[S.PRACTICAL_PAGE[level]].title)}</strong></td></tr>`];
      pr.parts.forEach(n=>{ const r=DATA.pr.filter(x=>x.user_id===uid&&x.level===level&&x.part===n).slice(-1)[0];
        rows.push(`<tr><td>${n}. ${S.PRACTICAL_PARTS[n]}</td><td>${r?stt('requested','Reported '+new Date(r.requested_at).toLocaleDateString())+(r.note?`<div class="note">“${esc(r.note)}”</div>`:''):stt('none','Not reported')}</td><td>${approveBtn(uid,`practical:${level}:${n}`)}</td></tr>`); });
      return rows.join(''); }).join('');
    return `<div class="student"><h3>${esc(s.name||'(no name)')} <small>${esc(s.email)} · ${esc(s.diploma)} · joined ${S.fmtDate(s.created_at)}</small></h3>
      <div class="grid">
        <div><h4>Enrollment</h4><table><tr><td>Student says request sent:</td><td>${s.enrollment_sent?stt('requested','Yes'):stt('none','Not yet')}</td><td>${approveBtn(uid,'enrollment','Confirmed')}</td></tr></table>
             <h4 style="margin-top:.8rem">Reading plan — ${esc(plan.title)}</h4><table><tr><td>${readDone} of ${plan.total} readings</td><td>${readDone>=plan.total?stt('passed','Complete'):stt('reading',Math.round(readDone/plan.total*100)+'%')}</td><td>${approveBtn(uid,'reading:'+s.plan)}</td></tr></table>
             <h4 style="margin-top:.8rem">Diploma</h4><table><tr><td>${esc(s.diploma)}</td><td></td><td>${approveBtn(uid,'diploma:'+s.diploma,'Awarded','— award the diploma')}</td></tr></table></div>
        <div><h4>Courses</h4><table>${courses}</table></div>
        <div><h4>Practical Training</h4><table>${practical||'<tr><td class="note">None required</td></tr>'}</table></div>
      </div></div>`;
  }).join('')||'<p class="note">No students yet.</p>';
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{const [uid,item]=b.dataset.ok.split('|'); const {error}=await sb.from('approvals').upsert({user_id:uid,item,approved:true,approved_at:new Date().toISOString()}); if(error) alert(error.message); start();});
  document.querySelectorAll('[data-un]').forEach(b=>b.onclick=async()=>{const [uid,item]=b.dataset.un.split('|'); const {error}=await sb.from('approvals').delete().eq('user_id',uid).eq('item',item); if(error) alert(error.message); start();});
}
$('#q').oninput=draw;
start();
</script>
</body>
</html>
